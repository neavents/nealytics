services:
  telemetry-db:
    image: clickhouse/clickhouse-server:latest
    container_name: global_telemetry_db
    ports:
      - "9000:9000"
      - "8123:8123"
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: always

  telemetry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: global_telemetry_api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - TelemetryEngine__ClickHouseConnectionString=Host=telemetry-db;Port=9000;Database=nealytics_core;User=default;Password=;
      # The headline feature, switched on by default so `docker compose up` demonstrates it rather
      # than describing it. The engine knows none of the names in that file; it reads the
      # declaration at boot and creates the matching columns, and GET /api/v1/schema then reports
      # back exactly what this deployment collects. Point it at your own file to get your own
      # vocabulary out of the same binary.
      - TelemetryEngine__SchemaFile=/etc/nealytics/schema.json
      - TelemetryEngine__WriteAheadLogDirectory=/app/logs/
      - TelemetryEngine__AllowedProjectKeys=neavents:projkey123,authhub:projkey456,ita:projkey789
      - TelemetryEngine__JwtSymmetricKey=replace_this_please
      - TelemetryEngine__MaxRequestBodyBytes=1048576
      - TelemetryEngine__MaxQueryLimit=10000
      - TelemetryEngine__MemoryChannelCapacity=100000
      - TelemetryEngine__DatabaseBatchCommitSize=10000
      - TelemetryEngine__ForceFlushIntervalSeconds=3
      - TelemetryEngine__RateLimitPermitCount=1000
      - TelemetryEngine__RateLimitWindowSeconds=10
      - TelemetryEngine__RateLimitQueueSize=500
      - TelemetryEngine__CorsAllowedOrigins=
      - TelemetryEngine__JwtClockSkewSeconds=30
      - TelemetryEngine__MaxInsertRetries=5
      - TelemetryEngine__RetryBackoffCeilingMs=30000
      - TelemetryEngine__DefaultSessionQueryRangeHours=24
      - TelemetryEngine__ConnectionPoolSize=16
      - TelemetryEngine__WalFileBufferBytes=65536
      - TelemetryEngine__EnableWireCompression=true
      - TelemetryEngine__EnableAsyncInsert=true
      - TelemetryEngine__MaxConcurrentConnections=20000
      - TelemetryEngine__EnableRequestDecompression=true
      - TelemetryEngine__EnablePrometheusScrape=false
      - DOTNET_gcServer=1
      - DOTNET_gcConcurrent=1
    volumes:
      - wal_logs:/app/logs/
      - ./neavents-schema.example.json:/etc/nealytics/schema.json:ro
    depends_on:
      - telemetry-db
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 512M
    restart: always

volumes:
  ch_data:
  wal_logs:
