name: Native WAL

on:
  push:
    branches: ['feat/correctness-and-safety*', 'feat/ingestion-performance*']
  pull_request:
    branches: [main, 'feat/correctness-and-safety*', 'feat/ingestion-performance*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
            rid: linux-x64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Inspect the prior ARM mutation detection
        if: matrix.architecture == 'arm64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40807694186 --repo '${{ github.repository }}' --name native-linux-arm64 --dir /tmp/nealytics-prior-arm
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          report = next(Path('/tmp/nealytics-prior-arm').rglob('mutation-report.json'))
          text = subprocess.check_output(['python3', 'native/report_mutants.py', str(report)], text=True)
          text = text[-2500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Prior ARM mutation review::' + text)
          PY

      - name: Qualify actual host architecture and native artifact
        shell: bash
        run: |
          set -o pipefail
          result_directory='artifacts/platform/${{ matrix.rid }}'
          mkdir -p "$result_directory"
          if bash native/qualify.sh '${{ matrix.rid }}' 2>&1 | tee "$result_directory/qualification.log"; then
            exit 0
          fi
          python3 - "$result_directory/qualification.log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Native qualification failed::' + text)
          PY
          exit 1

      - name: Upload verification v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-${{ matrix.rid }}
          retention-days: 7
          path: |
            artifacts/platform/${{ matrix.rid }}/host.txt
            artifacts/platform/${{ matrix.rid }}/qualification.log
            artifacts/platform/${{ matrix.rid }}/native/*.so
            artifacts/platform/${{ matrix.rid }}/native-c/*.gcov
            artifacts/platform/${{ matrix.rid }}/Nealytics.Engine.Tests.*/**/*.trx
            artifacts/platform/${{ matrix.rid }}/Nealytics.Engine.Tests.*/**/coverage.cobertura.xml
            artifacts/platform/${{ matrix.rid }}/http/*.trx
            artifacts/platform/${{ matrix.rid }}/denied/*.trx
            artifacts/platform/${{ matrix.rid }}/mutation/reports
            artifacts/platform/${{ matrix.rid }}/mutation/logs
            artifacts/platform/${{ matrix.rid }}/publish/Nealytics.Engine
