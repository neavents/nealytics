name: Integration connectors

on:
  push:
    branches: ['feat/integrations*', 'feat/developer-operator-tools*']
  pull_request:
    branches: [main, 'feat/integrations*', 'feat/developer-operator-tools*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    name: Published Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build the single-file image on its actual architecture
        run: docker build --tag nealytics-kafka-qualification:local .

      - name: Kafka, WAL, storage, restart and poison-prefix checks
        run: python3 scripts/qualify-kafka.py --image nealytics-kafka-qualification:local --architecture '${{ matrix.architecture }}' --output 'artifacts/kafka/${{ matrix.architecture }}'

      - name: Build the pinned optional S3 test fixture
        run: docker build --file tests/Fixtures/S3/Dockerfile --tag nealytics-s3-fixture:9e49d5e .

      - name: S3 versioned imports, checkpoint restart and query totals
        run: python3 scripts/qualify-s3.py --image nealytics-kafka-qualification:local --architecture '${{ matrix.architecture }}' --output 'artifacts/s3/${{ matrix.architecture }}'

      - name: Mapped S3 versioned imports and checkpoint restart
        run: python3 scripts/qualify-s3.py --mapped --image nealytics-kafka-qualification:local --architecture '${{ matrix.architecture }}' --output 'artifacts/mapped-s3/${{ matrix.architecture }}'

      - name: NDJSON streaming, receipts, schema and restart checks
        run: python3 scripts/qualify-ndjson.py --jobs --image nealytics-kafka-qualification:local --architecture '${{ matrix.architecture }}' --output 'artifacts/ndjson/${{ matrix.architecture }}'

      - name: Mapped Kafka source, offsets, storage and restart checks
        run: python3 scripts/qualify-kafka.py --mapped --image nealytics-kafka-qualification:local --architecture '${{ matrix.architecture }}' --output 'artifacts/mapped-kafka/${{ matrix.architecture }}'

      - name: Mapped NDJSON source, receipts, schema and restart checks
        run: python3 scripts/qualify-ndjson.py --mapped --jobs --image nealytics-kafka-qualification:local --architecture '${{ matrix.architecture }}' --output 'artifacts/mapped-ndjson/${{ matrix.architecture }}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: integrations-${{ matrix.architecture }}
          retention-days: 7
          path: |
            artifacts/kafka/${{ matrix.architecture }}
            artifacts/ndjson/${{ matrix.architecture }}
            artifacts/mapped-kafka/${{ matrix.architecture }}
            artifacts/mapped-ndjson/${{ matrix.architecture }}
            artifacts/s3/${{ matrix.architecture }}
            artifacts/mapped-s3/${{ matrix.architecture }}
