name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: nealytics-engine-linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: nealytics-engine-linux-arm64

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --ulimit nofile=262144:262144

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.clickhouse.id }} clickhouse-client -q "SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "ClickHouse did not become ready"; exit 1

      - name: Init ClickHouse schema
        run: |
          docker cp clickhouse-init.sql ${{ job.services.clickhouse.id }}:/tmp/clickhouse-init.sql
          docker exec ${{ job.services.clickhouse.id }} clickhouse-client --queries-file /tmp/clickhouse-init.sql

      - name: Publish and verify the binary stores rows
        env:
          SMOKE_OUT: publish
          SMOKE_RID: ${{ matrix.rid }}
        run: ./scripts/smoke-test.sh

      - name: Package
        run: |
          cd publish
          chmod +x Nealytics.Engine
          tar -czf ../${{ matrix.artifact }}.tar.gz Nealytics.Engine

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
