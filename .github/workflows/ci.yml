name: CI

on:
  push:
    branches: [main, 'feat/correctness-and-safety*', 'feat/ingestion-performance*']
  pull_request:
    branches: [main, 'feat/correctness-and-safety*', 'feat/ingestion-performance*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --nologo

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        shell: bash
        run: |
          if dotnet test tests/Nealytics.Engine.Tests.Unit --collect:"XPlat Code Coverage" --results-directory artifacts/unit --logger 'trx;LogFileName=unit.trx' --verbosity normal; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('artifacts/unit/unit.trx')
          if report.exists():
              namespace = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
              failures = [result for result in ET.parse(report).getroot().findall('.//t:UnitTestResult', namespace)
                          if result.attrib.get('outcome') == 'Failed']
              for result in failures[:5]:
                  error = result.find('t:Output/t:ErrorInfo/t:Message', namespace)
                  text = result.attrib['testName'] + ': ' + (error.text or '' if error is not None else '')
                  text = text[:2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Unit test failed::' + text)
          PY
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: artifacts/unit

  benchmark-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Benchmark unit tests
        run: dotnet test tests/Nealytics.Engine.Bench.Tests --collect:"XPlat Code Coverage" --results-directory artifacts/benchmark --verbosity normal

      - name: Restore pinned mutation tooling
        run: dotnet tool restore

      - name: Measurement helper mutation tests
        working-directory: bench/Nealytics.Engine.Bench
        run: dotnet stryker --config-file stryker-config.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-verification
          path: |
            artifacts/benchmark
            bench/Nealytics.Engine.Bench/StrykerOutput

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --ulimit nofile=262144:262144

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.clickhouse.id }} clickhouse-client -q "SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "ClickHouse did not become ready"; exit 1

      - name: Init ClickHouse schema
        run: |
          docker cp clickhouse-init.sql ${{ job.services.clickhouse.id }}:/tmp/clickhouse-init.sql
          docker exec ${{ job.services.clickhouse.id }} clickhouse-client --queries-file /tmp/clickhouse-init.sql
          docker exec ${{ job.services.clickhouse.id }} clickhouse-client -q "DESCRIBE nealytics_core.global_events"

      - name: Integration tests
        env:
          TelemetryEngine__ClickHouseConnectionString: "Host=127.0.0.1;Port=9000;Database=nealytics_core;User=default;Password=;"
          TelemetryEngine__JwtSymmetricKey: "integration-test-key-at-least-32-bytes-long!!"
          TelemetryEngine__AllowedProjectKeys: "test-key-1,test-key-2"
          TelemetryEngine__WriteAheadLogDirectory: "/tmp/nealytics-ci-wal/"
        run: dotnet test tests/Nealytics.Engine.Tests.Integration --filter 'Category!=PerformanceMeasurement' --verbosity normal

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --ulimit nofile=262144:262144

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.clickhouse.id }} clickhouse-client -q "SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "ClickHouse did not become ready"; exit 1

      - name: Init ClickHouse schema
        run: |
          docker cp clickhouse-init.sql ${{ job.services.clickhouse.id }}:/tmp/clickhouse-init.sql
          docker exec ${{ job.services.clickhouse.id }} clickhouse-client --queries-file /tmp/clickhouse-init.sql

      - name: Smoke test
        run: ./scripts/smoke-test.sh

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [unit-tests, benchmark-tests, integration-tests, smoke-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
