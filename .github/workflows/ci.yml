name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --nologo

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test tests/Nealytics.Engine.Tests.Unit --verbosity normal

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --ulimit nofile=262144:262144

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.clickhouse.id }} clickhouse-client -q "SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "ClickHouse did not become ready"; exit 1

      - name: Init ClickHouse schema
        run: |
          docker cp clickhouse-init.sql ${{ job.services.clickhouse.id }}:/tmp/clickhouse-init.sql
          docker exec ${{ job.services.clickhouse.id }} clickhouse-client --queries-file /tmp/clickhouse-init.sql
          docker exec ${{ job.services.clickhouse.id }} clickhouse-client -q "DESCRIBE nealytics_core.global_events"

      - name: Integration tests
        env:
          TelemetryEngine__ClickHouseConnectionString: "Host=127.0.0.1;Port=9000;Database=nealytics_core;User=default;Password=;"
          TelemetryEngine__JwtSymmetricKey: "integration-test-key-at-least-32-bytes-long!!"
          TelemetryEngine__AllowedProjectKeys: "test-key-1,test-key-2"
          TelemetryEngine__WriteAheadLogDirectory: "/tmp/nealytics-ci-wal/"
        run: dotnet test tests/Nealytics.Engine.Tests.Integration --verbosity normal

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    # The only job that runs the real published binary and asserts a row was COMMITTED, rather
    # than that ingest returned 202. Cheap now that the publish is seconds.
    timeout-minutes: 30
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --ulimit nofile=262144:262144

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.clickhouse.id }} clickhouse-client -q "SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "ClickHouse did not become ready"; exit 1

      - name: Init ClickHouse schema
        run: |
          docker cp clickhouse-init.sql ${{ job.services.clickhouse.id }}:/tmp/clickhouse-init.sql
          docker exec ${{ job.services.clickhouse.id }} clickhouse-client --queries-file /tmp/clickhouse-init.sql

      - name: Smoke test
        run: ./scripts/smoke-test.sh

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, smoke-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
